<!DOCTYPE html>
<html lang="es" data-pal="a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#EFEAE2">
<!-- La paleta se aplica ANTES de pintar: si esperara al script del final, arrancaria
     con la default y pegaria un salto de color. ?pal=a|b|c la pisa (sirve para comparar). -->
<script>(function(){try{var m=location.search.match(/[?&]pal=([abc])/);var p=m?m[1]:localStorage.getItem('cerd_pal');if(p)document.documentElement.setAttribute('data-pal',p);}catch(e){}})();</script>
<!-- Safari en iOS cachea el HTML con ganas. Ver APP_VER mas abajo. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cerdapp</title>
<meta name="apple-mobile-web-app-title" content="Cerdapp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png?v=5">
<!-- ?v=N en los iconos: iOS cachea el icono de inicio por URL; al cambiarlo hay que subir N. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=5">
<link rel="manifest" href="manifest.json?v=5">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ==================================================================
   NEUMORFISMO
   Todo sale de la misma superficie (--bg). Lo que sobresale lleva sombra
   clara arriba-izquierda y oscura abajo-derecha (.card, botones); lo que se
   hunde, las mismas sombras hacia adentro (campos, elegido, porciones).
   Un solo color de acento por paleta: el resto es la superficie.

   Paletas (del reel de niki.aroca, "los dos primeros dan el clima, el
   tercero la personalidad"):
     a  Mandarina  verde bosque + naranja mandarina + amarillo cresta
     b  Indigo     negro onix + indigo electrico + verde menta
     c  Carmesi    azul vela + azul marino + rosa carmesi
   ================================================================== */
:root, [data-pal=a]{
  --bg:#EFEAE2; --sh-d:#CFC7BA; --sh-l:#FFFFFF;
  --text:#1E2A23; --muted:#66706A; --dim:#9AA097;
  --pri:#1F5C46; --pri-ink:#FFFFFF; --acc:#F26A1B; --acc-ink:#FFFFFF; --hi:#D9EF4F; --hi-lt:rgba(217,239,79,.55);
  --p0:#E05E13; --p0-lt:rgba(242,106,27,.11); --p1:#1F5C46; --p1-lt:rgba(31,92,70,.10);
}
[data-pal=b]{
  --bg:#E9E9F1; --sh-d:#C8C8D6; --sh-l:#FFFFFF;
  --text:#121217; --muted:#5E5E70; --dim:#9696A6;
  --pri:#5B2EFF; --pri-ink:#FFFFFF; --acc:#7DF2C2; --acc-ink:#121217; --hi:#7DF2C2; --hi-lt:rgba(125,242,194,.5);
  --p0:#5B2EFF; --p0-lt:rgba(91,46,255,.09); --p1:#0C9468; --p1-lt:rgba(60,214,160,.16);
}
[data-pal=c]{
  --bg:#E3EBF4; --sh-d:#C1CCDA; --sh-l:#FFFFFF;
  --text:#0F2340; --muted:#55667F; --dim:#8F9CB0;
  --pri:#13305E; --pri-ink:#FFFFFF; --acc:#E8436B; --acc-ink:#FFFFFF; --hi:#BFD9F2; --hi-lt:rgba(150,196,240,.55);
  --p0:#13305E; --p0-lt:rgba(19,48,94,.09); --p1:#D83560; --p1-lt:rgba(232,67,107,.11);
}
:root{
  --green:#278F5A; --green-lt:rgba(39,143,90,.12); --amber:#B97500; --amber-lt:rgba(245,165,36,.16);
  --red:#C93445; --red-lt:rgba(217,60,74,.11); --blue:#2A6FB8; --blue-lt:rgba(47,127,208,.11);
  /* nombres viejos que usa el JS */
  --surface:var(--bg); --surface2:rgba(0,0,0,.035); --border:var(--sh-d); --pig-2:var(--pri);
  --r:22px;
  --up:6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
  --up-s:3px 3px 8px var(--sh-d), -3px -3px 8px var(--sh-l);
  --in:inset 3px 3px 7px var(--sh-d), inset -3px -3px 7px var(--sh-l);
  --in-s:inset 2px 2px 4px var(--sh-d), inset -2px -2px 4px var(--sh-l);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
/* Oscuro: neumorfismo sobre grafito. La sombra clara pasa a ser apenas mas clara
   que el fondo; si fuera blanca se veria un borde brillante, no relieve. */
@media (prefers-color-scheme: dark){
  :root, [data-pal=a], [data-pal=b], [data-pal=c]{
    --bg:#202126; --sh-d:#16171A; --sh-l:#2B2C33;
    --text:#ECECEF; --muted:#A4A5AE; --dim:#6F7179;
    --surface2:rgba(255,255,255,.04);
    --green:#4CC98A; --green-lt:rgba(76,201,138,.13); --amber:#F2B442; --amber-lt:rgba(242,180,66,.14);
    --red:#FF6B7A; --red-lt:rgba(255,107,122,.13); --blue:#6AAEF0; --blue-lt:rgba(106,174,240,.13);
  }
  :root, [data-pal=a]{ --pri:#3FAE85; --pri-ink:#0F1A15; --acc:#FF8A3D; --acc-ink:#1A0E05; --hi-lt:rgba(217,239,79,.16); --p0:#FF8A3D; --p0-lt:rgba(255,138,61,.12); --p1:#4FC79A; --p1-lt:rgba(79,199,154,.12); }
  [data-pal=b]{ --pri:#8F70FF; --pri-ink:#FFFFFF; --acc:#7DF2C2; --acc-ink:#0D1A14; --hi-lt:rgba(125,242,194,.14); --p0:#9F86FF; --p0-lt:rgba(143,112,255,.14); --p1:#7DF2C2; --p1-lt:rgba(125,242,194,.11); }
  [data-pal=c]{ --pri:#8DB4F0; --pri-ink:#0B1A30; --acc:#FF6B8E; --acc-ink:#24060E; --hi-lt:rgba(150,196,240,.16); --p0:#9CBDF2; --p0-lt:rgba(141,180,240,.13); --p1:#FF7A9A; --p1-lt:rgba(255,107,142,.12); }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px;
  line-height:1.45;padding-bottom:calc(92px + var(--safe-bot));-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.hide{display:none!important}
b,strong{font-weight:800}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding:calc(12px + var(--safe-top)) 18px 12px}
header .logo-w{width:46px;height:46px;border-radius:16px;box-shadow:var(--up-s);display:flex;align-items:center;justify-content:center;flex:none}
header .logo{width:36px;height:36px}
header h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.4px}
header .sub{font-size:11.5px;color:var(--dim);font-weight:600}
header .sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);box-shadow:var(--up-s);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;flex:none}
.iconbtn:active{box-shadow:var(--in-s)}
.iconbtn svg{width:20px;height:20px}

/* ---------- tabs abajo ---------- */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-bot));z-index:30;background:var(--bg);
  border-radius:26px;box-shadow:var(--up);display:flex;gap:4px;padding:7px;max-width:616px;margin:0 auto}
.tab{flex:1;border:0;background:none;padding:7px 2px;border-radius:19px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--dim)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--pri);box-shadow:var(--in-s);background:var(--hi-lt)}

main{padding:6px 18px 18px;max-width:640px;margin:0 auto}
.panel{display:none}.panel.on{display:block}

/* ---------- tarjetas ---------- */
.card{background:var(--bg);border:0;border-radius:var(--r);padding:16px;margin:0 0 18px;box-shadow:var(--up)}
.card h3{margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.card h2{margin:0 0 4px;font-size:18px;font-weight:800;line-height:1.25}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.title-day{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:-.8px;line-height:1.15}
.section-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 10px}

/* ---------- botones ---------- */
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:700;font-size:14.5px;min-height:46px;
  background:var(--pri);color:var(--pri-ink);box-shadow:4px 4px 10px var(--sh-d), -4px -4px 10px var(--sh-l)}
.btn:active{box-shadow:var(--in);filter:brightness(.96)}
.btn.sec{background:var(--bg);color:var(--text);box-shadow:var(--up-s)}
.btn.sec:active{box-shadow:var(--in-s)}
.btn.green{background:var(--acc);color:var(--acc-ink)}
.btn.small{min-height:38px;padding:8px 14px;font-size:13px;border-radius:13px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.6}
.chip{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--bg);box-shadow:var(--up-s);
  border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;min-height:36px;color:var(--muted)}
.chip.on{box-shadow:var(--in-s);color:var(--pri);font-weight:800}
.chip.g.on{color:var(--green)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:9px;padding:3px 9px;background:var(--surface2);color:var(--muted)}
.tag.g{background:var(--green-lt);color:var(--green)} .tag.a{background:var(--amber-lt);color:var(--amber)}
.tag.b{background:var(--blue-lt);color:var(--blue)} .tag.r{background:var(--p0-lt);color:var(--acc)}
[data-pal=b] .tag.r{color:var(--pri)}

/* ---------- metas del dia ---------- */
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:14px 0 20px}
.meta{border-radius:var(--r);padding:14px;box-shadow:var(--up);position:relative;overflow:hidden}
.meta:before{content:'';position:absolute;left:14px;top:14px;width:8px;height:8px;border-radius:50%}
.meta .nm{font-weight:700;font-size:13px;color:var(--muted);padding-left:15px}
.meta .kc{font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.8px;margin-top:4px}
.meta .kc span{font-size:13px!important;font-weight:700;color:var(--muted);letter-spacing:0}
.meta .pr{font-size:12.5px;font-weight:600;color:var(--muted)}
.meta.p0:before{background:var(--p0)} .meta.p1:before{background:var(--p1)}
.meta.p0 .kc{color:var(--p0)} .meta.p1 .kc{color:var(--p1)}

/* ---------- comida ---------- */
.meal .slot{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.meal .slot .em{font-size:17px;width:34px;height:34px;border-radius:50%;box-shadow:var(--in-s);background:var(--hi-lt);display:flex;align-items:center;justify-content:center}
.meal .slot .lb{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.meal .nombre{font-size:18px;font-weight:800;line-height:1.25;margin:0 0 6px;letter-spacing:-.3px}
.porc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.pp{border-radius:18px;padding:11px 12px;font-size:13.5px;box-shadow:var(--in)}
.pp .who{font-weight:800;font-size:13px;display:flex;justify-content:space-between;margin-bottom:5px}
.pp.p0 .who{color:var(--p0)} .pp.p1 .who{color:var(--p1)}
.pp ul{margin:0;padding:0;list-style:none}
.pp li{padding:3px 0;line-height:1.35}
.pp li .g{color:var(--dim);font-size:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.aviso{border-radius:16px;padding:11px 13px;font-size:13.5px;font-weight:600;margin:10px 0;box-shadow:var(--in-s)}
.aviso.a{background:var(--amber-lt)} .aviso.b{background:var(--blue-lt)} .aviso.g{background:var(--green-lt)}
.tick{display:block;width:100%;margin-top:9px;border:0;background:var(--bg);box-shadow:var(--up-s);border-radius:12px;
  min-height:38px;font-weight:700;font-size:13px;color:var(--muted)}
.tick.on{box-shadow:var(--in-s);color:var(--green)}
.vote{border:0;background:var(--bg);box-shadow:var(--up-s);border-radius:13px;width:42px;height:38px;font-size:16px}
.vote.on{box-shadow:var(--in-s);background:var(--green-lt)} .vote.no.on{background:var(--red-lt)}

/* ---------- semana ---------- */
.week-nav{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.week-nav .t{flex:1;text-align:center;font-weight:800}
.day{background:var(--bg);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--up)}
.day.hoy{box-shadow:var(--up), inset 0 0 0 2px var(--pri)}
.day .dn{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.day .sl{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--surface2);cursor:pointer}
.day .sl:first-of-type{border-top:0}
.day .sl .k{width:74px;flex:none;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;padding-top:2px}
.day .sl .v{flex:1;font-weight:600;font-size:14px;line-height:1.3}

/* ---------- heladera ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.match{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--surface2);cursor:pointer}
.match:first-child{border-top:0}
.match .pct{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;box-shadow:var(--in-s)}
.match .nm{font-weight:700;line-height:1.25}

/* ---------- progreso ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat{border-radius:16px;padding:10px 11px;box-shadow:var(--in-s)}
.stat .v{font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.4px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.lst{margin:0;padding:0;list-style:none}
.lst li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--surface2);font-size:14px}
.lst li:first-child{border-top:0}

/* ---------- formularios: hundidos ---------- */
.fld{margin:0 0 14px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 7px 4px;text-transform:uppercase;letter-spacing:.8px}
.fld input,.fld select,.fld textarea{width:100%;height:48px;border:0;border-radius:15px;background:var(--bg);box-shadow:var(--in);
  padding:0 14px;-webkit-appearance:none;appearance:none}
.fld textarea{height:72px;padding:12px 14px}
.fld input:focus,.fld select:focus{outline:none;box-shadow:var(--in), 0 0 0 2px var(--pri)}
input[type=checkbox]{accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg .chip{flex:1;justify-content:center}
.hint{font-size:12.5px;color:var(--muted);margin:6px 4px 0}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,20,26,.35);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal-box{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;
  padding:18px 18px calc(26px + var(--safe-bot));-webkit-overflow-scrolling:touch}
#modal-box .mh{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
#modal-box .mh h2{flex:1;margin:0;font-size:21px;font-weight:800;line-height:1.25;letter-spacing:-.4px}
body.modal-open{overflow:hidden}
ol.pasos{padding-left:20px;margin:6px 0} ol.pasos li{margin:5px 0}

/* ---------- login / carga / bienvenida ---------- */
.full{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;text-align:center}
.full .logo-big{width:170px;height:170px;border-radius:50%;box-shadow:var(--up);display:flex;align-items:center;justify-content:center}
.full .big-logo{width:125px;height:125px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@media (prefers-reduced-motion: reduce){.full .big-logo{animation:none}}
.full h1{font-size:34px;font-weight:800;margin:22px 0 4px;letter-spacing:-1px}
.full p{color:var(--muted);max-width:320px;margin:0 auto 22px}
#onb{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;display:none;
  padding:calc(18px + var(--safe-top)) 18px calc(30px + var(--safe-bot))}
#onb.on{display:block}
#onb .in{max-width:560px;margin:0 auto}
.steps{display:flex;gap:8px;margin:6px 0 20px}
.steps i{flex:1;height:10px;border-radius:6px;box-shadow:var(--in-s)}
.steps i.on{background:var(--pri)}
.pal button.on .sw{transform:scale(1.1)}
.bubble{display:flex;gap:12px;align-items:flex-end;margin-bottom:18px}
.bubble svg{width:62px;height:62px;flex:none}
.bubble .txt{background:var(--bg);box-shadow:var(--up-s);border-radius:20px 20px 20px 6px;padding:12px 14px;
  font-weight:600;text-align:left}
.tip-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--surface2)}
.tip-row:first-child{border-top:0}
.tip-row .nm{flex:1;font-weight:700;font-size:14px}
.tri{display:flex;gap:5px}
.tri button{border:0;background:var(--bg);box-shadow:var(--up-s);border-radius:11px;font-size:11.5px;font-weight:700;
  padding:6px 7px;min-height:34px;color:var(--dim)}
.tri button.on0{box-shadow:var(--in-s);color:var(--text)}
.tri button.on1{box-shadow:var(--in-s);color:var(--amber)}
.tri button.on2{box-shadow:var(--in-s);color:var(--green)}

/* selector de paleta */
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pal button{border:0;background:var(--bg);box-shadow:var(--up-s);border-radius:18px;padding:10px 6px;font-weight:700;font-size:12.5px;color:var(--muted)}
.pal button.on{box-shadow:var(--in-s);color:var(--text)}
.pal .sw{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.pal .sw i{width:16px;height:16px;border-radius:50%;display:block}

#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bot));transform:translateX(-50%);z-index:70;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:700;font-size:14px;
  max-width:90vw;display:none;text-align:center}
#toast.err{background:var(--red);color:#fff} #toast.ok{background:var(--pri);color:var(--pri-ink)}
#offline{background:var(--amber-lt);color:var(--text);font-size:13px;font-weight:600;padding:8px 18px;display:flex;gap:8px;align-items:center}

/* ---------- el cerdito animado ---------- */
.big-logo,.logo{display:block}
.big-logo svg,.logo svg{display:block;width:100%;height:100%}
.pig{overflow:visible}
.pig .drop{transform-box:fill-box;transform-origin:50% 0;animation:pigdrop 1.9s ease-in infinite}
.pig .drop.d2{animation-delay:.5s}.pig .drop.d3{animation-delay:1s}.pig .drop.d4{animation-delay:1.45s}
@keyframes pigdrop{0%{transform:translateY(-4px) scale(.4);opacity:0}18%{transform:translateY(0) scale(1);opacity:1}
  100%{transform:translateY(34px) scale(.85);opacity:0}}
.pig .cuerpo{transform-box:view-box;transform-origin:100px 194px}
.pig .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.pig .boca{transform-box:fill-box;transform-origin:50% 0}
.pig .hocico{transform-box:fill-box;transform-origin:50% 50%}
.pig .cachete{transform-box:fill-box;transform-origin:50% 50%}
.pig .puff{opacity:0;transform-box:fill-box;transform-origin:0 100%}
/* suspiro: inhala, entrecierra los ojos, larga el aire */
.pig.a-sigh .cuerpo{animation:pigsigh 2.4s ease-in-out}

/* ==================================================================

   ================================================================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function iso(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function hoyISO(){ return iso(new Date()); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function lunes(s){ var d = parse(s); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); }
function diasEntre(a, b){ return Math.round((parse(b) - parse(a)) / 864e5); }
function fN(n){ return Math.round(n).toLocaleString('es-AR'); }
function fKg(n){ return (Math.round(n * 10) / 10).toLocaleString('es-AR', {minimumFractionDigits:1, maximumFractionDigits:1}); }
function fechaLarga(s){ var d = parse(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fechaCorta(s){ var d = parse(s); return d.getDate() + '/' + (d.getMonth() + 1); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* 1.5 -> "1 &frac12;" */
function fq(q){
  var w = Math.floor(q + 1e-9), f = q - w, fr = '';
  if (Math.abs(f - .25) < .01) fr = '&frac14;';
  else if (Math.abs(f - .5) < .01) fr = '&frac12;';
  else if (Math.abs(f - .75) < .01) fr = '&frac34;';
  if (!w) return fr || '0';
  return w + (fr ? ' ' + fr : '');
}

/* Random con semilla: la propuesta de un dia no cambia cada vez que se abre la app. */
function semilla(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }

function toast(msg, cls){

  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = 'none'; }, 2800);
}

/* ==================================================================
   PESO: la tendencia, no el dato del dia
   El peso de un dia se mueve un kilo por agua, sal y glucogeno. Se promedian
   las mediciones de los ultimos 10 dias (minimo 3).
   ================================================================== */
function pesosDe(em){
  return ((D && D.pesos) || []).filter(function(p){ return p.email === em && +p.peso > 0; })
    .map(function(p){ return {date:p.date, peso:+p.peso}; })
    .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
}
function tendencia(em){
  var ps = pesosDe(em);
  return ps.map(function(p, i){
    var win = ps.filter(function(q, j){ return j <= i && diasEntre(q.date, p.date) <= 10; });
    if (win.length < 3) win = ps.slice(Math.max(0, i - 2), i + 1);
    var m = win.reduce(function(a, q){ return a + q.peso; }, 0) / win.length;
    return {date:p.date, peso:p.peso, t:m};
  });
}
function pesoActual(em){
  var t = tendencia(em); if (t.length) return t[t.length - 1].t;
  var pf = perfil(em); return pf ? +pf.peso : 0;
}
/* kg por semana en los ultimos 21 dias (regresion lineal sobre la tendencia) */
function ritmoReal(em){
  var t = tendencia(em); if (!t.length) return null;
  var fin = t[t.length - 1].date;
  var v = t.filter(function(x){ return diasEntre(x.date, fin) <= 21; });
  if (v.length < 4 || diasEntre(v[0].date, fin) < 14) return null;
  var xs = v.map(function(x){ return diasEntre(v[0].date, x.date); }), ys = v.map(function(x){ return x.t; });
  var n = xs.length, mx = xs.reduce(function(a,b){return a+b;},0)/n, my = ys.reduce(function(a,b){return a+b;},0)/n;
  var num = 0, den = 0;
  for (var i = 0; i < n; i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  return den ? num / den * 7 : null;
}

/* ==================================================================
   ACTIVIDAD
   Diego: sale de Gym Bro (sesiones y km de cardio).
   El resto: lo que registra en la app (pilates, etc). Sin registros, lo del perfil.
   ================================================================== */
function kcalAct(a, peso){
  var A = ACTIVIDADES[a.tipo] || ACTIVIDADES.otro;
  var met = A.met[clamp(+a.int || 1, 0, 2)];
  return Math.round((met - 1) * peso * (+a.min || 0) / 60);
}
function actsDe(em){
  return ((D && D.actividad) || []).filter(function(a){ return a.email === em; })
    .sort(function(a, b){ return a.date < b.date ? 1 : -1; });
}
function actividad(em){
  var peso = pesoActual(em) || 70, hoy = hoyISO(), desde = addDays(hoy, -28);
  var out = {kcalDia:0, fuente:'perfil', ses:0, km:0, regs:0};
  var g = (D && D.gym) || {};
  if (g.email && g.email === em){
    var fechas = {}; (g.ses || []).forEach(function(f){ if (f > desde && f <= hoy) fechas[f] = 1; });
    var ses = Object.keys(fechas).length / 4;
    var km = (g.cardio || []).filter(function(c){ return c.date > desde && c.date <= hoy; })
      .reduce(function(a, c){ return a + (+c.km || 0); }, 0) / 4;
    out.ses = ses; out.km = km; out.fuente = 'gym';
    out.kcalDia = (ses * 3.5 * peso + km * peso) / 7;
  }
  var regs = actsDe(em).filter(function(a){ return a.date > desde && a.date <= hoy; });
  if (regs.length){
    var primera = regs[regs.length - 1].date;
    var dias = clamp(diasEntre(primera, hoy) + 1, 7, 28);
    var tot = regs.reduce(function(a, r){ return a + (+r.kcal || kcalAct(r, peso)); }, 0);
    out.kcalDia += tot / dias; out.regs = regs.length;
    out.fuente = out.fuente === 'gym' ? 'gym+app' : 'app';
  }
  if (out.fuente === 'perfil'){
    var pf = perfil(em) || {};
    out.ses = +pf.ses || 0;
    out.kcalDia = out.ses * 2.6 * peso * .8 / 7;   /* sesion tipica de 50 min a MET 3.6 */
  }
  return out;
}

/* ==================================================================
   CALORIAS
   Mifflin-St Jeor (1990): una ESTIMACION. Despues se corrige con el peso real.
   ================================================================== */
var RITMOS = {suave:[.0035,'Suave'], normal:[.005,'Recomendado'], rapido:[.0075,'R&aacute;pido']};
var TRABAJO = {sentado:[1.2,'Sentado casi todo el d&iacute;a'], mixto:[1.35,'Mixto, camino bastante'], pie:[1.5,'De pie o en movimiento']};
function objetivo(em){
  var pf = perfil(em); if (!pf || !pf.alt) return null;
  var peso = pesoActual(em) || +pf.peso;
  var edad = new Date().getFullYear() - (+pf.nac || 1990);
  var bmr = 10 * peso + 6.25 * (+pf.alt) - 5 * edad + (pf.sexo === 'h' ? 5 : -161);
  var fact = (TRABAJO[pf.trab] || TRABAJO.sentado)[0];
  var act = actividad(em);
  var tdee = bmr * fact + act.kcalDia;
  var kgSem = peso * (RITMOS[pf.ritmo] || RITMOS.normal)[0];
  var def = Math.min(kgSem * 7700 / 7, tdee * .25);
  var piso = pf.sexo === 'h' ? 1500 : 1200;
  var kcal = Math.round(Math.max(piso, tdee - def + (+pf.aj || 0)) / 10) * 10;
  var base = peso;
  if (pf.meta && peso > +pf.meta * 1.3) base = +pf.meta * 1.15;   /* con mucho sobrepeso, sobre el peso meta */
  var prot = Math.round(base * 1.8 / 5) * 5;
  return {bmr:bmr, tdee:tdee, def:def, kgSem:kgSem, kcal:kcal, prot:prot, peso:peso, edad:edad, fact:fact, act:act, piso:piso};
}
/* Como se reparte el dia. Casi nunca desayunan: mate y, a veces, frutos secos. */
function reparto(em){
  var o = objetivo(em); if (!o) return null;
  var pf = perfil(em);
  var M = pf.man === 'desayuno' ? o.kcal * .2 : (pf.man === 'matefs' ? 125 : 0);
  var R = o.kcal - M;
  return {de:pf.man === 'desayuno' ? M : 0, ma:pf.man === 'matefs' ? M : 0, al:R * .38, me:R * .2, ce:R * .42, prot:o.prot, kcal:o.kcal};
}
function metaSlot(em, slot){
  var r = reparto(em); if (!r) return {k:0, p:0};
  var k = r[slot] || 0;
  return {k:k, p:r.prot * k / r.kcal};
}

/* ==================================================================
   PORCIONES: la olla compartida
   Una receta, y a cada uno lo suyo: la proteina se escala a su proteina,
   el hidrato cierra sus calorias, la verdura es fija. Despues se redondea a
   medidas caseras (no hay balanza) y se recalcula lo que de verdad comeria.
   ================================================================== */
/* dia.extra = {email: [ids de EXTRAS_COMIDA]}. Se descuenta de las comidas del dia que
   todavia no se tildaron como comidas, en proporcion a cada una, sin bajar ninguna
   de la mitad. Lo ya comido no se toca. */
function extrasDe(fecha, em){
  var ids = ((dia(fecha).extra || {})[em]) || [], k = 0, p = 0;
  var l = ids.map(function(id, i){ var e = EXC[id] || EXC.chico; k += e[3]; p += e[4]; return {i:i, e:e}; });
  return {l:l, k:k, p:p};
}
function slotsRestantes(em, fecha){
  return slotsDe().filter(function(s){
    return presente(em, fecha, s) && dia(fecha)[s] !== 'afuera' && recDe(fecha, s) && !comido(fecha, s, em);
  });
}
/* dia.rest = {slot: {lugar, it: {email: [[id, fraccion], ...]}}} */
function restDe(fecha, slot, em){
  var l = ((((dia(fecha).rest || {})[slot] || {}).it || {})[em]) || [], k = 0, p = 0;
  l.forEach(function(x){ var c = CAR[x[0]]; if (c){ k += c[4] * x[1]; p += c[5] * x[1]; } });
  return {l:l, k:k, p:p};
}
function comeAfuera(em, fecha, slot){ return enSlot(em, slot) && (dia(fecha)[slot] === 'afuera' || fueraDe(fecha, slot).indexOf(em) !== -1); }
/* lo que se paso afuera, por encima de lo que tocaba en esa comida */
function excesoAfuera(fecha, em){
  var k = 0, p = 0;
  slotsDe().forEach(function(s){
    if (!comeAfuera(em, fecha, s)) return;
    var R = restDe(fecha, s, em); if (!R.k) return;
    var m = metaSlot(em, s); k += Math.max(0, R.k - m.k); p += Math.max(0, R.p - m.p);
  });
  return {k:k, p:p};
}
function extraTotal(fecha, em){
  var a = extrasDe(fecha, em), b = excesoAfuera(fecha, em);
  return {k:a.k + b.k, p:a.p + b.p};
}
function descuento(em, fecha, slot){
  if (!fecha) return {k:0, p:0};
  var ex = extraTotal(fecha, em); if (!ex.k) return {k:0, p:0};
  var rest = slotsRestantes(em, fecha); if (rest.indexOf(slot) === -1) return {k:0, p:0};
  var tot = rest.reduce(function(a, s){ return a + metaSlot(em, s).k; }, 0) || 1;
  var m = metaSlot(em, slot), share = m.k / tot;
  return {k:Math.min(ex.k * share, m.k * .5), p:Math.min(ex.p * share, m.p * .5)};
}
function porciones(rec, em, slot, fecha){
  var m = metaSlot(em, slot), dsc = descuento(em, fecha, slot), K = m.k - dsc.k, Pr = m.p - dsc.p;
  var it = rec.c.map(function(c){ var a = ALI[c[0]]; return {f:c[0], a:a, r:c[1], g:c[2], u:c[3] || a.u}; });
  function kc(x, g){ return x.a.k * g / 100; }
  var kF = 0, kP = 0, pP = 0, kH = 0, kU = 0;
  it.forEach(function(x){
    if (x.r === 'P'){ kP += kc(x, x.g); pP += x.a.p * x.g / 100; }
    else if (x.r === 'H') kH += kc(x, x.g);
    else if (x.r === 'U') kU += kc(x, x.g);
    else kF += kc(x, x.g);
  });
  var sP = 1, sH = 1, sU = 1;
  if (pP > 0) sP = clamp(Pr * .8 / pP, .5, 2.5);
  if (kH === 0 && kU === 0 && kP > 0) sP = clamp(Math.max(sP, (K - kF) / kP), .5, 2.5);
  /* tope por persona (mx): 5 huevos en una tortilla no es una porcion */
  var kPa = 0, chica = slot === 'me' || slot === 'de';
  it.forEach(function(x){ if (x.r === 'P'){ x.gs = Math.min(x.g * sP, (x.a.mx || 1e9) * (chica ? .67 : 1)); kPa += kc(x, x.gs); } });
  if (kU > 0) sU = clamp((K - kF - kPa) / kU, .3, 4);
  if (kH > 0) sH = clamp((K - kF - kPa - kU * sU) / kH, .25, 3);
  function upd(x){ x.gr = x.q * x.u[1]; x.kcal = kc(x, x.gr); x.prot = x.a.p * x.gr / 100; }
  it.forEach(function(x){
    var s = x.r === 'H' ? sH : x.r === 'U' ? sU : 1;
    var st = x.u[3] || .5, q = (x.r === 'P' ? x.gs : x.g * s) / x.u[1];
    x.q = Math.max(st, Math.round(q / st) * st); upd(x);
  });
  /* Ajuste fino. Redondear a medidas caseras puede comerse 50 o 100 kcal, y con eso
     un descuento chico (o la diferencia entre dos personas) no se veia en el plato.
     Se acerca el total a la meta de a un paso: primero hidratos, despues unidades y,
     solo para bajar, la proteina. */
  var orden = it.filter(function(x){ return x.r === 'H'; })
    .concat(it.filter(function(x){ return x.r === 'U'; }), it.filter(function(x){ return x.r === 'P'; }));
  function total(){ return it.reduce(function(a, x){ return a + x.kcal; }, 0); }
  for (var vuelta = 0; vuelta < 8; vuelta++){
    var dif = total() - K, hecho = false;
    if (Math.abs(dif) < 35) break;
    for (var j = 0; j < orden.length && !hecho; j++){
      var x = orden[j], st = x.u[3] || .5, kst = kc(x, st * x.u[1]);
      if (dif > 0 && x.q - st >= st - 1e-9 && kst <= dif * 1.6){ x.q -= st; upd(x); hecho = true; }
      else if (dif < 0 && x.r !== 'P' && kst <= -dif * 1.6 && (x.q + st) * x.u[1] <= x.g * 3){ x.q += st; upd(x); hecho = true; }
    }
    if (!hecho) break;
  }
  var tk = total(), tp = it.reduce(function(a, x){ return a + x.prot; }, 0);
  return {it:it, kcal:tk, prot:tp, K:K, dsc:dsc};
}
function cantTxt(x){
  var u = x.u, nm = x.q <= 1 ? u[0] : u[2];
  var g = x.u[1] >= 20 && x.r !== 'G' ? ' <span class="g">(' + fN(x.gr) + ' g)</span>' : '';
  return '<b>' + fq(x.q) + ' ' + nm + '</b> ' + nombreCorto(x) + g + (x.a.libre ? ' <span class="tag g">libre</span>' : '');
}
/* "2 milanesas de milanesa de pollo" queda feo: si el nombre ya arranca con la
   unidad, se saca esa palabra ("2 milanesas de pollo al horno", "2 huevos"). */
function nombreCorto(x){
  var n = x.a.n, lo = n.charAt(0).toLowerCase() + n.slice(1), w0 = lo.split(' ')[0];
  if (w0.slice(0, 5) === x.u[0].slice(0, 5) || x.u[0].indexOf(w0) !== -1) return lo.slice(w0.length).trim();
  return 'de ' + lo;
}

/* ==================================================================
   EL PLAN
   KV['plan:<lunes>'] = { 'YYYY-MM-DD': {al:'id'|'sobras'|'afuera', me:'id', ce:'id', de:'id'} }
   ================================================================== */
function planSem(fecha){ return KV['plan:' + lunes(fecha)] || {}; }
function dia(fecha){ return planSem(fecha)[fecha] || {}; }
function setSlot(fecha, slot, val){
  var k = 'plan:' + lunes(fecha);
  var p = JSON.parse(JSON.stringify(KV[k] || {}));
  p[fecha] = p[fecha] || {};
  p[fecha][slot] = val;
  setKV(k, p);
}
function hayDesayuno(){ return personas().some(function(em){ return (perfil(em) || {}).man === 'desayuno'; }); }
function slotsDe(){ var s = ['al', 'me', 'ce']; if (hayDesayuno()) s.unshift('de'); return s; }
function enSlot(em, slot){ return slot !== 'de' || (perfil(em) || {}).man === 'desayuno'; }
/* La oficina no es fija: se marca dia por dia (dia.of). Ese dia el almuerzo son
   las sobras de la cena anterior, y esa cena tiene que servir de vianda. */
function esOficina(fecha){ return !!dia(fecha).of; }

/* Afuera por persona: dia.fuera = {slot: [emails]}. Si salen todos, el slot
   queda en 'afuera'. Quien come afuera no cuenta en la olla ni en las compras. */
function fueraDe(fecha, slot){ return ((dia(fecha).fuera || {})[slot]) || []; }
function presente(em, fecha, slot){ return enSlot(em, slot) && (!fecha || fueraDe(fecha, slot).indexOf(em) === -1); }
function setFuera(fecha, slot, quien){
  var f = JSON.parse(JSON.stringify(dia(fecha).fuera || {}));
  if (quien === 'todos'){ delete f[slot]; setSlot(fecha, 'fuera', f); setSlot(fecha, slot, 'afuera'); }
  else if (quien === 'casa'){ delete f[slot]; setSlot(fecha, 'fuera', f); if (dia(fecha)[slot] === 'afuera') volverPlan(fecha, slot); }
  else {
    var l = f[slot] || [], i = l.indexOf(quien);
    if (i === -1) l.push(quien); else l.splice(i, 1);
    f[slot] = l;
    var quedan = personas().filter(function(em){ return enSlot(em, slot) && l.indexOf(em) === -1; });
    if (!quedan.length){ delete f[slot]; setSlot(fecha, 'fuera', f); setSlot(fecha, slot, 'afuera'); }
    else { setSlot(fecha, 'fuera', f); if (dia(fecha)[slot] === 'afuera') volverPlan(fecha, slot); }
  }
  closeModal(); render();
}
function elegirAfuera(fecha, slot){
  var fu = fueraDe(fecha, slot), todos = dia(fecha)[slot] === 'afuera';
  var h = mh('&iquest;Qui&eacute;n come afuera?');
  h += '<p class="small muted" style="margin-top:0">' + SLOTS[slot][0] + ' del ' + DIAS[parse(fecha).getDay()] + ' ' + fechaCorta(fecha) +
    '. Quien come afuera no se cuenta en la olla ni en la lista de compras.</p>';
  h += '<button class="btn sec block" style="margin-bottom:12px" onclick="setFuera(\'' + fecha + '\',\'' + slot + '\',\'todos\')">Los dos</button>';
  personas().filter(function(em){ return enSlot(em, slot); }).forEach(function(em){
    var sale = fu.indexOf(em) !== -1;
    h += '<button class="btn sec block" style="margin-bottom:12px" onclick="setFuera(\'' + fecha + '\',\'' + slot + '\',\'' + em + '\')">' +
      (sale ? nombre(em) + ' vuelve a comer en casa' : 'Solo ' + nombre(em)) + '</button>';
  });
  if (fu.length || todos) h += '<button class="btn block" onclick="setFuera(\'' + fecha + '\',\'' + slot + '\',\'casa\')">Comen los dos en casa</button>';
  openModal(h);
}

/* "Lo comi": un toque, sin contar nada. dia.ok = {slot: {email: 1}}.
   Sirve para saber cuanto del plan se sigue, y para no bajar calorias cuando
   el peso no se mueve porque el plan no se siguio. */
function comido(fecha, slot, em){ return !!(((dia(fecha).ok || {})[slot] || {})[em]); }
function toggleComido(fecha, slot, em){
  var o = JSON.parse(JSON.stringify(dia(fecha).ok || {}));
  o[slot] = o[slot] || {};
  if (o[slot][em]) delete o[slot][em]; else o[slot][em] = 1;
  setSlot(fecha, 'ok', o); render();
}
/* ultimos N dias sin contar hoy (hoy todavia no termino) */
function adherencia(em, dias){
  var hoy = hoyISO(), plan = 0, ok = 0, usa = false;
  for (var i = 1; i <= dias; i++){
    var f = addDays(hoy, -i), d = dia(f);
    Object.keys(d.ok || {}).forEach(function(sl){ if ((d.ok[sl] || {})[em]) usa = true; });
    slotsDe().forEach(function(s){
      if (!recDe(f, s) || d[s] === 'afuera' || !presente(em, f, s)) return;
      plan++; if (comido(f, s, em)) ok++;
    });
  }
  return {plan:plan, ok:ok, pct:plan ? ok / plan : null, usa:usa};
}
function setOficina(fecha, v){
  setSlot(fecha, 'of', v ? 1 : 0);
  var ayer = addDays(fecha, -1), ce = dia(ayer).ce;
  if (v){
    if (REC[ce] && REC[ce].v === 0){ var r = mejor(ayer, 'ce'); if (r){ setSlot(ayer, 'ce', r.id); ce = r.id; toast('Cambi&eacute; la cena de la noche anterior por una que sirve de vianda'); } }
    if (REC[ce]) setSlot(fecha, 'al', 'sobras');
  } else if (dia(fecha).al === 'sobras'){
    var r2 = mejor(fecha, 'al'); setSlot(fecha, 'al', r2 ? r2.id : '');
  }
  render();
}
function tipoSlot(slot){ return slot === 'al' ? 'a' : slot === 'ce' ? 'c' : 'm'; }

/* receta real de un slot ('sobras' apunta a la cena de ayer) */
function recDe(fecha, slot){
  var v = dia(fecha)[slot];
  if (v === 'sobras'){ var c = dia(addDays(fecha, -1)).ce; return REC[c] || null; }
  return REC[v] || null;
}

/* lo usado en los ultimos dias, para variar */
function usadoCerca(fecha, dias){
  var out = [];
  for (var i = -dias; i <= dias; i++){
    if (!i) continue;
    var f = addDays(fecha, i), d = dia(f);
    Object.keys(d).forEach(function(s){ var r = REC[d[s]]; if (r) out.push({r:r, d:Math.abs(i), f:f, s:s}); });
  }
  return out;
}

function puntaje(r, fecha, slot, excl){
  if (r.t.indexOf(tipoSlot(slot)) === -1) return -1e9;
  if (excl && excl.indexOf(r.id) !== -1) return -1e9;
  var h = hogar(), likes = h.likes || {};
  if (likes[r.id] === -1) return -1e9;
  var fr = frecuencia(r.ti);
  if (fr === 0) return -1e9;
  var s = 1 + (fr - 1) * 2;   /* los dos "a veces" = 1, los dos "seguido" = 3 */
  if (r.propia) s += 1.5;     /* la cargaron ustedes: les gusta */
  if (likes[r.id] === 1) s += 2;
  /* la cena de la noche anterior a un dia de oficina tiene que servir de vianda */
  if (slot === 'ce' && esOficina(addDays(fecha, 1)) && r.v === 0) return -1e9;
  usadoCerca(fecha, 7).forEach(function(u){
    if (u.r.id === r.id) s -= 6 - u.d * .5;
    else if (u.r.ti === r.ti && u.d <= 3) s -= 3 - u.d * .5;   /* el mismo tipico, no dia por medio */
    if (r.pr && u.r.pr === r.pr && u.d <= 1 && u.r.t !== 'm') s -= 1.2;
  });
  var hoyD = dia(fecha);
  ['al','ce'].forEach(function(o){ if (o !== slot && REC[hoyD[o]] && REC[hoyD[o]].pr === r.pr) s -= 2; });
  /* con la heladera cargada, lo que se puede hacer con lo que hay manda en los proximos 3 dias */
  if (despensa().length && diasEntre(hoyISO(), fecha) <= 3) s += 5 * matchHeladera(r).pct;
  var dd = parse(fecha);
  if (dd.getDate() === 29 && r.ti === 'noquis') s += 6;        /* los noquis del 29 */
  if (dd.getDay() === 0 && slot === 'al' && /asado|pastas|fideos|noquis/.test(r.ti)) s += 1.5;
  return s + semilla(fecha + slot + r.id) * 1.5;
}
function mejor(fecha, slot, excl){
  var best = null, bs = -1e8;
  RECETAS.forEach(function(r){ var s = puntaje(r, fecha, slot, excl); if (s > bs){ bs = s; best = r; } });
  return best;
}

/* Completa lo que falte desde hoy hasta el domingo de la semana que se mira.
   No pisa nada que ya este elegido. */
function completar(desde, hasta){
  var cambios = {};
  for (var f = desde; f <= hasta; f = addDays(f, 1)){
    var k = 'plan:' + lunes(f);
    var p = cambios[k] || JSON.parse(JSON.stringify(KV[k] || {}));
    var d = p[f] = p[f] || {};
    KV[k] = p;   /* en memoria ya, para que el puntaje vea lo elegido en esta vuelta */
    slotsDe().forEach(function(s){
      if (d[s]) return;
      if (s === 'al' && esOficina(f)){
        var ayer = dia(addDays(f, -1)).ce;
        if (REC[ayer] && REC[ayer].v !== 0){ d[s] = 'sobras'; return; }
      }
      var r = mejor(f, s);
      if (r) d[s] = r.id;
    });
    cambios[k] = p;
  }
  Object.keys(cambios).forEach(function(k){ setKV(k, cambios[k]); });
}
function otra(fecha, slot){
  var key = fecha + slot, cur = dia(fecha)[slot];
  _skip[key] = _skip[key] || [];
  if (REC[cur]) _skip[key].push(cur);
  var r = mejor(fecha, slot, _skip[key]);
  if (!r){ _skip[key] = []; r = mejor(fecha, slot, [cur]); }
  if (r){ setSlot(fecha, slot, r.id); render(); }
}

/* ==================================================================
   HELADERA
   ================================================================== */
function despensa(){ return KV.despensa || []; }
function tengo(k){ return despensa().indexOf(k) !== -1; }
function reqDe(r){
  var req = [];
  r.c.forEach(function(c){
    var a = ALI[c[0]];
    if (a.base) return;
    if (a.alt) req.push({alt:a.alt, n:a.n});
    else if (a.ing) a.ing.forEach(function(i){ req.push({k:i}); });
    else req.push({k:c[0]});
  });
  (r.x || []).forEach(function(x){ req.push({k:x[0]}); });
  var vistos = {};
  return req.filter(function(q){ var id = q.k || q.n; if (vistos[id]) return false; vistos[id] = 1; return true; });
}
function nombreIng(k){ return ALI[k] ? ALI[k].n : (EXTRA[k] ? EXTRA[k][0] : k); }
function matchHeladera(r){
  var req = reqDe(r), ok = 0, falta = [];
  req.forEach(function(q){
    var si = q.alt ? q.alt.some(tengo) : tengo(q.k);
    if (si) ok++; else falta.push(q.alt ? q.n : nombreIng(q.k));
  });
  return {pct:req.length ? ok / req.length : 0, falta:falta};
}

/* Vuelve a proponer hoy y los 2 dias siguientes priorizando lo que hay. No toca lo
   que ya se tildo como comido, ni las sobras de vianda, ni lo que se come afuera. */
function rearmarConHeladera(){
  var hoy = hoyISO(), n = 0;
  for (var i = 0; i < 3; i++){
    var f = addDays(hoy, i), k = 'plan:' + lunes(f), p = JSON.parse(JSON.stringify(KV[k] || {})), d = p[f] = p[f] || {};
    ['de','al','me','ce'].forEach(function(s){
      var v = d[s];
      if (!v || v === 'afuera' || v === 'sobras') return;
      if (d.ok && d.ok[s] && Object.keys(d.ok[s]).length) return;
      delete d[s]; n++;
    });
    KV[k] = p; setKV(k, p);
  }
  completar(hoy, addDays(hoy, 2));
  renderHeladera(); toast('Listo: ' + n + ' comidas rearmadas con lo que hay', 'ok');
}

/* Lee un menu o ticket pegado: una linea por plato. Saca cantidades, precios y
   las lineas de la factura, y busca el plato de la carta mas parecido por palabras.
   Sin API ni servidor: todo pasa en el telefono. */
var NO_PLATO = ['total','subtotal','iva','cuit','factura','mesa','mozo','fecha','hora','cliente','descrip','regimen','impuesto',
                'ingresos','domicilio','inicio','srl','electronica','cae','dto','propina','gracias','www','cant','unit','resp',
                'impuestos','indirectos','contenido','transparencia','consumidor','ley','descuento','servicio','tarjeta','efectivo','vuelto'];
function leerTexto(){
  var txt = String($('ca-txt').value || '');
  var lineas = txt.split(/\n+/), out = [];
  lineas.forEach(function(l){
    var bruto = l.trim(); if (!bruto) return;
    var qty = 1, m = bruto.match(/^(\d{1,2})\s*[xX]?\s+(.*)$/);
    if (m){ qty = +m[1]; bruto = m[2]; }
    var limpio = bruto.replace(/\$?\s*\d[\d.,]*\s*$/g, '').replace(/\$?\s*\d[\d.,]*\s*$/g, '').replace(/[\.\-:_]+$/, '').trim();
    var norm = quitarAcentos(esc(limpio));
    if (norm.replace(/[^a-z]/g, '').length < 3) return;
    /* palabra por palabra: "C.A.E: 864..." tiene que caer igual que "cae" */
    var pals = norm.replace(/[^a-z]+/g, ' ').trim().split(' ');
    if (pals.some(function(w){ return NO_PLATO.indexOf(w) !== -1; }) || NO_PLATO.indexOf(norm.replace(/[^a-z]/g, '')) !== -1) return;
    out.push({n:limpio.charAt(0).toUpperCase() + limpio.slice(1).toLowerCase(), q:qty, id:matchCarta(norm)});
  });
  _carta.leido = out;
  pintarLeido();
}
function matchCarta(norm){
  var ws = norm.split(/[^a-z]+/).filter(function(w){ return w.length >= 4; }), best = null, bs = 0;
  CARTA.forEach(function(c){
    var qs = (c[6] + ' ' + quitarAcentos(c[3])).split(/[^a-z]+/), sc = 0;
    ws.forEach(function(w){ if (qs.some(function(q){ return q.length >= 4 && (q.indexOf(w.slice(0, 5)) === 0 || w.indexOf(q.slice(0, 5)) === 0); })) sc++; });
    if (sc > bs){ bs = sc; best = c[0]; }
  });
  return best;
}

  if (!L.length){ $('ca-leido').innerHTML = '<div class="small muted" style="margin-top:8px">No encontr&eacute; platos en ese texto.</div>'; return; }
  $('ca-leido').innerHTML = (qs.length > 1 ? '<button class="btn green block" style="margin:12px 0 4px" onclick="todoCompartido()">Todo compartido</button>' : '') +
    L.map(function(x, i){

          return '<button class="chip" style="min-height:32px;padding:4px 12px" onclick="sumarLeido(' + i + ',\'' + em + '\')">+ ' + nombre(em) + '</button>';
        }).join('') + (qs.length > 1 ? '<button class="chip" style="min-height:32px;padding:4px 12px" onclick="sumarLeido(' + i + ',\'comp\')">Compartido</button>' : '') +
        '</div></div>';
    }).join('');
}
function sumarLeido(i, quien){
  var x = _carta.leido[i], id = x.id || 'otromed', qs = quienesAfuera(_carta.f, _carta.s);

/* para buscar sin acentos (el archivo es ASCII: los acentos vienen como entidades) */

  return (d.textContent || '').normalize('NFD').replace(marcas, '').toLowerCase();
}

function chartPeso(em){
  var t = tendencia(em).filter(function(x){ return diasEntre(x.date, hoyISO()) <= 120; });
  if (t.length < 2) return '<div class="muted small">Con dos pesadas ya aparece el gr&aacute;fico.</div>';
  var pf = perfil(em), W = 320, H = 150, pl = 32, pr = 8, pt = 10, pb = 20;
  var vals = t.map(function(x){ return x.peso; }).concat(t.map(function(x){ return x.t; }));
  if (pf.meta) vals.push(+pf.meta);
  var mn = Math.floor(Math.min.apply(null, vals) - .5), mx = Math.ceil(Math.max.apply(null, vals) + .5);
  var d0 = t[0].date, dn = Math.max(1, diasEntre(d0, t[t.length - 1].date));
  function X(f){ return pl + (W - pl - pr) * diasEntre(d0, f) / dn; }
  function Y(v){ return pt + (H - pt - pb) * (mx - v) / (mx - mn); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  [mn, (mn + mx) / 2, mx].forEach(function(v){
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--border)" stroke-width="1"/>' +
      '<text x="' + (pl - 4) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--dim)" font-weight="700">' + fKg(v) + '</text>';
  });
  if (pf.meta && +pf.meta >= mn) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(+pf.meta) + '" y2="' + Y(+pf.meta) + '" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>';
  var col = idx(em) ? 'var(--p1)' : 'var(--p0)';
  t.forEach(function(x){ s += '<circle cx="' + X(x.date) + '" cy="' + Y(x.peso) + '" r="3" fill="' + col + '" opacity=".35"/>'; });
  s += '<polyline fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' +
    t.map(function(x){ return X(x.date).toFixed(1) + ',' + Y(x.t).toFixed(1); }).join(' ') + '"/>';
  s += '<text x="' + pl + '" y="' + (H - 4) + '" font-size="10" fill="var(--dim)" font-weight="700">' + fechaCorta(d0) + '</text>' +
    '<text x="' + (W - pr) + '" y="' + (H - 4) + '" text-anchor="end" font-size="10" fill="var(--dim)" font-weight="700">' + fechaCorta(t[t.length - 1].date) + '</text></svg>';
  return '<div class="chart">' + s + '</div><div class="small muted" style="margin-top:4px">La l&iacute;nea es la tendencia: los puntos sueltos son cada pesada. Lo que decide es la l&iacute;nea.</div>';
}
function sugerenciaAjuste(em){
  var o = objetivo(em), r = ritmoReal(em), pf = perfil(em);
  if (r === null) return '<div class="aviso b">En 2 semanas con 4 pesadas o m&aacute;s te digo si el n&uacute;mero de calor&iacute;as est&aacute; bien o hay que moverlo. La f&oacute;rmula es una estimaci&oacute;n: el peso real es el que manda.</div>';
  var baja = -r, meta = o.kgSem;
  if (pf.ajf && diasEntre(pf.ajf, hoyISO()) < 14) return '<div class="aviso b">Ajustaste las calor&iacute;as el ' + fechaCorta(pf.ajf) + '. Esper&aacute; dos semanas para ver el efecto.</div>';
  var ad = adherencia(em, 14);
  if (baja < meta * .5 && ad.usa && ad.plan >= 10 && ad.pct < .7)
    return '<div class="aviso a">Est&aacute;s bajando <b>' + fKg(Math.max(0, baja)) + ' kg por semana</b> (objetivo ' + fKg(meta) + '), pero el plan se sigui&oacute; en <b>' +
      Math.round(ad.pct * 100) + '%</b> de las comidas. Antes de bajar calor&iacute;as conviene seguirlo m&aacute;s: el n&uacute;mero puede estar bien.</div>';
  if (baja < meta * .5 && o.kcal - 150 >= o.piso)
    return '<div class="aviso a">Est&aacute;s bajando <b>' + fKg(Math.max(0, baja)) + ' kg por semana</b> y el objetivo es ' + fKg(meta) + '. Sugerencia: <b>150 kcal menos por d&iacute;a</b>.' +

/* Lo que hay que cocinar en total: todos los que comen esa comida y, si al dia
   siguiente hay vianda, tambien eso. Es lo que mira Vicky para cocinar. */
function ollaTotal(r, fecha, slot){
  var tot = {}, comidas = [[fecha, slot]];
  if (fecha && slot === 'ce' && dia(addDays(fecha, 1)).al === 'sobras') comidas.push([addDays(fecha, 1), 'al']);
  if (!fecha) comidas = [[null, slot || (r.t.indexOf('c') !== -1 ? 'ce' : r.t.indexOf('a') !== -1 ? 'al' : 'me')]];
  comidas.forEach(function(c){
    personas().filter(function(em){ return presente(em, c[0], c[1]); }).forEach(function(em){
      porciones(r, em, c[1], c[0]).it.forEach(function(x){
        tot[x.f] = tot[x.f] || {g:0, a:x.a, u:x.u, q:0};
        tot[x.f].g += x.gr; tot[x.f].q += x.q;
      });
    });
  });
  return {tot:tot, vianda:comidas.length > 1};
}
function crudoTxt(f, t){
  var a = ALI[f];
  if (a.cr && a.cr !== 1){
    var c = t.g / a.cr, s = Math.round(c / 10) * 10 + ' g crudo';
    if (a.r) s += ' (&asymp; ' + fq(Math.max(.25, Math.round(c / a.r[1] * 4) / 4)) + ' ' + a.r[0] + ')';
    return s;
  }
  return '';
}

/* ==================================================================
   RECETAS PROPIAS
   Ustedes eligen los ingredientes; las cantidades las pone el mismo motor que
   al resto: la proteina se escala a la de cada uno, los hidratos cierran las
   calorias, la verdura es fija. hogar.recetas = [{id, n, t, c, x, pa}]
   ================================================================== */
function cargarPropias(){
  for (var i = RECETAS.length - 1; i >= 0; i--) if (RECETAS[i].propia){ delete REC[RECETAS[i].id]; RECETAS.splice(i, 1); }
  (hogar().recetas || []).forEach(function(r){
    var o = JSON.parse(JSON.stringify(r));
    o.propia = 1; o.ti = 'propias'; o.pa = o.pa && o.pa.length ? o.pa : ['Como la hacen siempre.'];
    o.tr = 'Receta de ustedes: las cantidades las calcula la app para cada uno.';
    var pp = o.c.filter(function(c){ return c[1] === 'P'; })[0];
    o.pr = pp ? pp[0] : 'propia';
    RECETAS.push(o); REC[o.id] = o;
  });
}
/* rol y porcion base de cada ingrediente, para no pedirle a nadie que pese nada */
function rolDe(k){
  var a = ALI[k], kc = a.k || 1;
  if (a.ing) return 'U';
  if (a.libre || a.alt) return 'V';
  if (a.g * 9 / kc > .8) return 'G';
  if (a.p * 4 / kc >= .35) return 'P';
  if (a.k <= 45) return 'V';
  if (a.c * 4 / kc >= .5) return 'H';
  return 'F';
}
function baseDe(k, rol){
  var u = ALI[k].u[1];
  if (rol === 'P') return u < 80 ? u * 2 : u;
  if (rol === 'H') return u < 60 ? u * 2 : u;
  if (rol === 'U') return u * 2;
  return u;
}
var ROL_N = {P:'Prote&iacute;na', H:'Hidrato', U:'Plato por unidad', V:'Verdura', F:'Extra', G:'Grasa'};

  ['prot','lac','ver','alm'].forEach(function(g){

  });
  h += '<div class="small" style="font-weight:700;margin:10px 4px 6px">Sin calor&iacute;as (para la heladera)</div><div class="chips">' +
    Object.keys(EXTRA).map(function(k){

    }).join('') + '</div></div>';
  h += '<div class="fld"><label>Pasos (opcional)</label><textarea style="height:96px" placeholder="Un paso por l&iacute;nea" onchange="_rd.pa=this.value">' + esc(r.pa) + '</textarea></div>';
  h += '<div id="rd-prev"></div>';

/* ---------- compras ---------- */
function verCompras(){
  var hoy = hoyISO(), l = addDays(lunes(hoy), semOffset * 7), desde = l < hoy ? hoy : l, fin = addDays(l, 6);
  var tot = {}, ext = {}, armados = {};
  for (var f = desde; f <= fin; f = addDays(f, 1)){
    slotsDe().forEach(function(s){
      var v = dia(f)[s], r = REC[v]; if (!r) return;   /* sobras ya se cocinaron la noche anterior */
      var O = ollaTotal(r, f, s);
      Object.keys(O.tot).forEach(function(k){
        var t = O.tot[k];
        if (ALI[k].ing){ armados[k] = armados[k] || {q:0, a:ALI[k]}; armados[k].q += t.q; return; }
        tot[k] = tot[k] || {g:0, u:t.u}; tot[k].g += t.g;
      });
      (r.x || []).forEach(function(x){ ext[x[0]] = (ext[x[0]] || 0) + x[1]; });
    });
  }
  var chk = KV['compras:' + l] || {};
  var secs = {};
  Object.keys(tot).forEach(function(k){
    var a = ALI[k]; if (a.base) return;
    var t = tot[k], txt;
    if (a.cr && a.cr !== 1){ txt = crudoTxt(k, t); }
    else {
      var q = Math.ceil(t.g / t.u[1] * 2) / 2;
      txt = fq(q) + ' ' + (q <= 1 ? t.u[0] : t.u[2]);
      if (t.u[1] >= 20) txt += ' <span class="g">(' + fN(Math.round(t.g / 50) * 50) + ' g)</span>';
    }
    (secs[a.s] = secs[a.s] || []).push({k:k, n:a.n, txt:txt});
  });
  Object.keys(armados).forEach(function(k){
    var a = ALI[k], q = Math.ceil(armados[k].q);
    (secs.alm = secs.alm || []).push({k:k, n:a.n, txt:q + ' ' + (q === 1 ? a.u[0] : a.u[2]) + ' <span class="g">(' + a.ing.map(nombreIng).join(', ').toLowerCase() + ')</span>'});
  });
  Object.keys(ext).forEach(function(k){
    var e = EXTRA[k]; if (!e) return;
    (secs[e[1]] = secs[e[1]] || []).push({k:k, n:e[0], txt:ext[k] > 1 ? 'x' + ext[k] : ''});
  });
  var h = mh('&#128722; Lista de compras');
  h += '<p class="small muted" style="margin-top:0">Del ' + fechaCorta(desde) + ' al ' + fechaCorta(fin) + ', para los dos. Lo que ya est&aacute; en la heladera aparece tachado.</p>';
  ['car','ver','lac','alm','pan'].forEach(function(s){
    if (!secs[s]) return;
    h += '<div class="card"><h3>' + SECCION[s] + '</h3><ul class="lst">' + secs[s].map(function(x){
      var ya = tengo(x.k), on = chk[x.k];
      return '<li style="' + (ya ? 'opacity:.45' : '') + '"><input type="checkbox" style="width:22px;height:22px" ' + (on ? 'checked' : '') +
        ' onchange="tildarCompra(\'' + l + '\',\'' + x.k + '\',this.checked)"><div style="flex:1;' + (ya ? 'text-decoration:line-through' : '') + '"><b>' + x.n + '</b>' +
        (x.txt ? ' <span class="small muted">' + x.txt + '</span>' : '') + '</div></li>';
    }).join('') + '</ul></div>';
  });
  h += '<button class="btn green block" onclick="comprado(\'' + l + '\')">Ya compr&eacute; lo tildado: a la heladera</button>';
  openModal(h);
}
function tildarCompra(l, k, v){ var c = JSON.parse(JSON.stringify(KV['compras:' + l] || {})); c[k] = v; setKV('compras:' + l, c); }
function comprado(l){
  var c = KV['compras:' + l] || {}, d = despensa().slice(), n = 0;
  Object.keys(c).forEach(function(k){
    if (!c[k]) return;
    var a = ALI[k], keys = a && a.ing ? a.ing : [k];
    keys.forEach(function(x){ if (d.indexOf(x) === -1){ d.push(x); n++; } });
  });
  setKV('despensa', d); setKV('compras:' + l, {});
  closeModal(); toast(n + ' cosas a la heladera', 'ok');
}

function leerPerfiles(){

/* Cada uno marca lo suyo y se cruza: comen juntos casi siempre, asi que si uno

  var vals = personas().map(function(em){ var v = tipicosDe(em)[ti]; return v === undefined ? 1 : v; });
  if (!vals.length) return 1;
  if (vals.indexOf(0) !== -1) return 0;
  return vals.reduce(function(a, b){ return a + b; }, 0) / vals.length;
}

      (mio ? 'Tu perfil' : (ok ? 'Lo completa ' + nombre(u.email) : 'Todav&iacute;a no entr&oacute;')) + '</div></div>' +

      (mio ? '<button class="btn small sec" onclick="editarPerfil(\'' + u.email + '\')">Editar</button>' : '') + '</div>';
  }).join('');
  h += '<div class="section-t">Qu&eacute; comen</div><button class="btn sec block" onclick="editarGustos()">Mis platos de siempre</button>' +
    '<button class="btn sec block" style="margin-top:12px" onclick="tourI=0;verTour()">C&oacute;mo se usa</button>';
  var mias = hogar().recetas || [];
  h += '<div class="section-t">Recetas propias</div><div class="card">' +
    (mias.length ? '<ul class="lst">' + mias.map(function(r){
      return '<li><div style="flex:1;font-weight:700">' + r.n + '</div><button class="btn small sec" onclick="editarReceta(\'' + r.id + '\')">Editar</button></li>';
    }).join('') + '</ul>' : '<div class="small muted">Carguen las que hacen siempre: eligen los ingredientes y yo calculo cu&aacute;nto le toca a cada uno.</div>') +
    '<button class="btn block" style="margin-top:12px" onclick="nuevaReceta()">+ Receta nueva</button></div>';
  var nos = Object.keys((hogar().likes || {})).filter(function(k){ return hogar().likes[k] === -1 && REC[k]; });
  if (nos.length) h += '<div class="card" style="margin-top:12px"><h3>Recetas descartadas</h3><ul class="lst">' + nos.map(function(k){
    return '<li><div style="flex:1">' + REC[k].n + '</div><button class="btn small sec" onclick="votar(\'' + k + '\',-1);openAjustes()">Volver a proponer</button></li>';
  }).join('') + '</ul></div>';
  h += '<div class="section-t">Estilo</div><div class="pal">' + Object.keys(PALETAS).map(function(k){
    var P = PALETAS[k];
    return '<button class="' + (paletaActual() === k ? 'on' : '') + '" onclick="elegirPaleta(\'' + k + '\')"><div class="sw">' +
      P.c.map(function(c){ return '<i style="background:' + c + '"></i>'; }).join('') + '</div>' + P.n + '</button>';
  }).join('') + '</div>';
  h += '<div class="section-t">App</div><div class="row"><button class="btn sec" style="flex:1" onclick="closeModal();reintentar()">Actualizar</button>' +
    '<button class="btn sec" style="flex:1" onclick="salir()">Salir</button></div>' +
    '<p class="small dim" style="text-align:center;margin-top:14px">Cerdapp ' + APP_VER + (DEMO ? ' &middot; demo' : '') + ' &middot; ' + esc(userEmail) + '</p>';
  openModal(h);
}
function editarPerfil(em){
  openModal(mh('Perfil') + formPerfil(em, perfil(em)) +
    '<button class="btn block" onclick="if(guardarPerfiles()){closeModal();render();toast(\'Perfil guardado\',\'ok\')}">Guardar</button>');
}
function editarGustos(){
  openModal(mh('Mis platos de siempre') + '<p class="small muted" style="margin-top:0">Lo que com&eacute;s en un mes normal. La semana propone sobre todo esto, en versi&oacute;n liviana.</p>' +
    tipicosHTML() + '<button class="btn block" onclick="closeModal();rearmarSilencioso();render()">Listo</button>');
}
function rearmarSilencioso(){
  var hoy = hoyISO();
  for (var f = addDays(hoy, 1); f <= addDays(lunes(hoy), 6); f = addDays(f, 1)){
    var k = 'plan:' + lunes(f), p = JSON.parse(JSON.stringify(KV[k] || {})); p[f] = {}; KV[k] = p;
  }
  completar(addDays(hoy, 1), addDays(lunes(hoy), 6));
}

/* ==================================================================
   BIENVENIDA
   Cada uno completa SOLO sus datos, al entrar por primera vez (decision de
   Diego: los datos de peso y cuerpo son de cada uno). Los pasos de la casa
   (platos de siempre y oficina) los hace solo el primero que entra; el
   segundo termina con su perfil y ya ve la semana armada.
   ================================================================== */
var onbPaso = 0;
function onboarding(){
  $('onb').classList.add('on');
  var p = onbPaso, armada = hogar().onb;
  var h = '<div class="steps">' + [0,1,2].map(function(i){ return '<i class="' + (i <= p ? 'on' : '') + '"></i>'; }).join('') + '</div>';
  function burbuja(t){ return '<div class="bubble">' + pigSVG() + '<div class="txt">' + t + '</div></div>'; }
  if (p === 0){
    var u = usuarios().filter(function(x){ return x.email === userEmail; })[0] || {email:userEmail};
    var hola = u.nombre ? ' ' + esc(u.nombre) : '';
    h += burbuja('&iexcl;Hola' + hola + '! Soy el cerdito de la olla. Contame de vos para calcular cu&aacute;nto te toca comer.');
    h += formPerfil(userEmail, perfil(userEmail));
    h += '<div class="hint" style="margin:-6px 4px 16px">Solo vos ves y cambi&aacute;s estos datos. Cada uno completa los suyos al entrar.</div>';
    h += '<button class="btn block" onclick="if(guardarPerfiles()){onbPaso=1;onboarding();window.scrollTo(0,0)}">Siguiente</button>';
  } else if (p === 1){
    h += burbuja('&iquest;Qu&eacute; com&eacute;s en un mes normal? Si es milanesa, pizza y fideos, eso propongo, en versi&oacute;n liviana. Nada de vivir de sopa.' +
      (armada ? ' Lo cruzo con lo que ya marc&oacute; el otro.' : ''));
    h += tipicosHTML();
    h += '<div class="row"><button class="btn sec" onclick="onbPaso=0;onboarding()">Atr&aacute;s</button><button class="btn" style="flex:1" onclick="tourI=0;onbPaso=2;onboarding();window.scrollTo(0,0)">Siguiente</button></div>';
  } else {
    _tourModal = false;
    h += tourHTML('finOnb()');
  }
  $('onb-in').innerHTML = h;
}
/* Guia: pantallas cortas con el cerdito. Al final de la bienvenida y en Ajustes. */
var tourI = 0, _tourModal = false;
function tourSlides(){
  var gym = D.gym && D.gym.email === userEmail;
  return [
    ['&#127869;', 'Hoy', 'Cada comida trae la receta y lo que le toca a cada uno en medidas caseras: palmas, tazas, cucharadas. Es una sola olla: lo que cambia es el plato de cada uno.'],
    ['&#10004;', 'Tild&aacute; lo que comen', 'Cuando terminan, toc&aacute; <b>Lo com&iacute;</b> en el plato de cada uno. No hay que contar nada: con eso s&eacute; cu&aacute;nto del plan se sigue, y si el peso no baja te digo si es por las calor&iacute;as o por el plan.'],
    ['&#128260;', 'Si no tienen ganas', '<b>Otra</b> propone otra receta, <b>Elegir</b> las muestra todas y <b>Afuera</b> es para cuando comen afuera, los dos o uno solo. Con &#128077; la propongo m&aacute;s; con &#128078; no la propongo m&aacute;s.'],
    ['&#128188;', 'Oficina', 'La noche antes, contest&aacute; <b>S&iacute;</b> en &iquest;Ma&ntilde;ana hay oficina? (est&aacute; en la cena). Se cocina de m&aacute;s y el almuerzo va de vianda.'],
    ['&#128197;', 'Semana y compras', 'La semana se arma sola y es la misma para los dos. La lista de compras suma lo de los dos; tild&aacute; lo que compraste y pasalo a la heladera.'],
    ['&#129482;', 'Heladera', 'Marc&aacute; lo que hay en casa (lo ven los dos) y te digo qu&eacute; se puede cocinar con eso. La semana prioriza esas recetas.'],
    ['&#128200;', 'Progreso', gym
      ? 'Tu peso y tus entrenamientos salen de Gym Bro: ac&aacute; no carg&aacute;s nada nuevo. A las dos semanas te digo si hay que mover las calor&iacute;as.'
      : 'Pesate una o dos veces por semana y registr&aacute; tu actividad (pilates, caminatas) en Progreso o desde Hoy. A las dos semanas te digo si hay que mover las calor&iacute;as.']
  ];
}
function tourHTML(fin){
  var S = tourSlides(), i = clamp(tourI, 0, S.length - 1), t = S[i];
  return '<div class="bubble">' + pigSVG() + '<div class="txt">C&oacute;mo se usa: ' + (i + 1) + ' de ' + S.length + '</div></div>' +
    '<div class="card" style="text-align:center;padding:26px 18px">' +
    '<div style="font-size:38px;width:78px;height:78px;margin:0 auto 14px;border-radius:50%;box-shadow:var(--in);background:var(--hi-lt);display:flex;align-items:center;justify-content:center">' + t[0] + '</div>' +
    '<h2>' + t[1] + '</h2><div class="muted" style="font-size:15px;line-height:1.5">' + t[2] + '</div>' +
    '<div class="row" style="justify-content:center;gap:7px;margin-top:18px">' + S.map(function(x, j){
      return '<i style="display:block;width:8px;height:8px;border-radius:50%;background:' + (j === i ? 'var(--pri)' : 'var(--sh-d)') + '"></i>';
    }).join('') + '</div></div>' +
    '<div class="row"><button class="btn sec" onclick="tourIr(-1)">Atr&aacute;s</button>' +
    (i < S.length - 1 ? '<button class="btn" style="flex:1" onclick="tourIr(1)">Siguiente</button>'
                      : '<button class="btn green" style="flex:1" onclick="' + fin + '">&iexcl;A cocinar!</button>') + '</div>';
}
function tourIr(d){
  var j = tourI + d;
  if (j < 0){ if (!_tourModal){ onbPaso = 1; onboarding(); } return; }
  tourI = clamp(j, 0, tourSlides().length - 1);
  if (_tourModal) verTour(); else { onboarding(); window.scrollTo(0, 0); }
}
function verTour(){ _tourModal = true; openModal(mh('C&oacute;mo se usa') + tourHTML('closeModal()')); }
function marcarTour(){
  var pf = perfil(userEmail); if (!pf || pf.tour) return;
  var p2 = JSON.parse(JSON.stringify(pf)); p2.tour = 1; setKV('perfil:' + userEmail, p2);
}
function finOnb(){
  var pf = JSON.parse(JSON.stringify(perfil(userEmail) || {})); pf.tipicos = pf.tipicos || {}; pf.tour = 1; setKV('perfil:' + userEmail, pf);
  if (!hogar().onb){ var h = JSON.parse(JSON.stringify(hogar())); h.onb = 1; setKV('hogar', h); }
  $('onb').classList.remove('on');
  rearmarSilencioso();
  switchTab('hoy'); toast('Listo: ya est&aacute; la semana &#128055;', 'ok');
}
/* falta si quien entra no tiene perfil o no marco sus platos */
function faltaOnb(){
  var pf = perfil(userEmail) || {};
  return usuarios().some(function(u){ return u.email === userEmail; }) && (!pf.alt || !pf.tipicos);
}
/* v1 y v2 guardaban los platos en hogar.tipicos (los marcaba el primero que
   entraba). Si hay un solo perfil completo, eran suyos: se pasan a su perfil. */
function migrarTipicos(){
  var h0 = hogar();
  if (!h0.tipicos && !h0.oficina) return;
  var ps = personas();
  if (h0.tipicos && ps.length === 1 && !perfil(ps[0]).tipicos){
    var pf = JSON.parse(JSON.stringify(perfil(ps[0]))); pf.tipicos = h0.tipicos; setKV('perfil:' + ps[0], pf);
  }
  var h = JSON.parse(JSON.stringify(h0)); delete h.tipicos; delete h.oficina; setKV('hogar', h);
}

/* ==================================================================
   API
   ================================================================== */
function apiPost(action, payload, btn){
  if (API_URL.indexOf('PEGAR_ACA') === 0) return Promise.reject(new Error('Falta la URL del Apps Script'));
  var old = '';
  if (btn){ btn.disabled = true; old = btn.innerHTML; btn.innerHTML = 'Guardando...'; }
  return fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:action, secret:SECRET, email:userEmail, payload:payload})
  }).then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'error desconocido'); return j; })
    .finally(function(){ if (btn){ btn.disabled = false; btn.innerHTML = old; } });
}
function fetchData(){
  if (DEMO){ cargarDemo(); return; }
  if (API_URL.indexOf('PEGAR_ACA') === 0){ hideLoad(); toast('Falta la URL del Apps Script', 'err'); return; }
  var ctrl = null, timer = null;
  try { ctrl = new AbortController(); } catch(e){}
  if (ctrl) timer = setTimeout(function(){ try { ctrl.abort(); } catch(e){} }, 30000);
  fetch(API_URL + '?t=' + Date.now(), ctrl ? {signal:ctrl.signal} : {})
    .then(function(r){ if (!r.ok) throw new Error('El servidor respondi&oacute; ' + r.status); return r.json(); })
    .then(function(data){ clearTimeout(timer); onDatos(data); })
    .catch(function(e){
      clearTimeout(timer); hideLoad();
      var m = String(e && e.message ? e.message : e);
      $('offline-txt').innerHTML = 'No pude conectarme' + (D ? ': est&aacute;s viendo lo &uacute;ltimo guardado.' : '.') + ' <span style="opacity:.7">(' + esc(m.indexOf('abort') !== -1 ? 'tard&oacute; m&aacute;s de 30 s' : m) + ')</span>';
      $('offline').classList.remove('hide');
    });
}
function reintentar(){ $('offline').classList.add('hide'); $('h-update').innerHTML = APP_VER + ' &middot; actualizando...'; fetchData(); }
function onDatos(data){
  if (!data || data.error){ hideLoad(); toast((data && data.error) || 'Respuesta vac&iacute;a', 'err'); return; }
  if (data.allowed_emails && data.allowed_emails.length && data.allowed_emails.indexOf(userEmail) === -1){ showDenied(); return; }
  D = data; KV = D.kv || {}; _ultimaCarga = Date.now();
  D.pesos = D.pesos || []; D.actividad = D.actividad || []; D.gym = D.gym || {};
  try { localStorage.setItem('cerd_cache', JSON.stringify(data)); } catch(e){}
  $('h-update').innerHTML = APP_VER + ' &middot; ' + (D.lastUpdate || '');
  $('offline').classList.add('hide');
  afterData(); hideLoad();
}
function afterData(){
  if (!PAL_URL && hogar().pal && hogar().pal !== paletaActual()) aplicarPaleta(hogar().pal);
  else if (PAL_URL) aplicarPaleta(PAL_URL);
  migrarTipicos();
  if (faltaOnb()){
    onbPaso = (perfil(userEmail) || {}).alt ? 1 : 0;
    onboarding(); return;
  }
  var y = window.scrollY;
  switchTab(activeTab);
  window.scrollTo(0, y);
  if (!DEMO && perfil(userEmail) && !perfil(userEmail).tour){ marcarTour(); tourI = 0; verTour(); }
}
function tryCache(){
  try {
    var c = localStorage.getItem('cerd_cache');
    if (c){ D = JSON.parse(c); KV = D.kv || {}; afterData(); hideLoad(); }
  } catch(e){}
}

/* ==================================================================
   DEMO (?demo=1): datos de ejemplo, se guardan solo en este navegador
   ================================================================== */
function cargarDemo(){
  var raw = null;
  try { raw = localStorage.getItem('cerd_demo'); } catch(e){}
  if (raw){ D = JSON.parse(raw); }
  else {
    var hoy = hoyISO(), pesos = [], ses = [], cardio = [], act = [];
    for (var i = 30; i >= 0; i -= 3){
      var f = addDays(hoy, -i);
      pesos.push({email:'diego@demo', date:f, peso:+(84.6 - (30 - i) * .065 + (i % 2 ? .4 : -.3)).toFixed(1)});
      pesos.push({email:'vicky@demo', date:f, peso:+(63.2 - (30 - i) * .03 + (i % 2 ? .3 : -.2)).toFixed(1)});
    }
    for (var j = 27; j >= 0; j--){
      var g = addDays(hoy, -j), dw = parse(g).getDay();
      if (dw === 1 || dw === 3 || dw === 5) ses.push(g);
      if (dw === 2 || dw === 6) cardio.push({date:g, km:2.4});
      if (dw === 2 || dw === 4) act.push({id:g + 'Ta', date:g, email:'vicky@demo', tipo:'pilates_reformer', min:50, int:1, zonas:['core','gluteos'], kcal:158, notas:''});
    }
    D = {
      demo:true, lastUpdate:'demo', allowed_emails:['diego@demo','vicky@demo'],
      usuarios:[{email:'diego@demo', nombre:'Diego'}, {email:'vicky@demo', nombre:'Vicky'}],
      kv:{
        'perfil:diego@demo':{nombre:'Diego', sexo:'h', nac:1986, alt:178, peso:84.6, meta:78, ritmo:'normal', trab:'sentado', man:'matefs',
                             tipicos:{milanesa:2, fideos:2, pizza:2, empanadas:1, asado:2, pescado:1, sopas:0, tacos:1}},
        'perfil:vicky@demo':{nombre:'Vicky', sexo:'m', nac:1990, alt:163, peso:63.2, meta:59, ritmo:'normal', trab:'mixto', man:'mate', ses:2, act:'pilates_reformer',
                             tipicos:{milanesa:2, fideos:1, pizza:2, empanadas:2, asado:1, pescado:0, ensaladas:2, tacos:2}},
        hogar:{onb:1, likes:{}},
        despensa:['pollo','huevo','arroz','cebolla','papa','zapallito','muzza','tomate']
      },
      pesos:pesos, actividad:act, gym:{email:'diego@demo', ses:ses, cardio:cardio}
    };
  }
  KV = D.kv;
  userEmail = 'diego@demo';
  $('h-update').innerHTML = APP_VER + ' &middot; demo';
  afterData(); hideLoad();
}
function guardarDemo(){ try { D.kv = KV; localStorage.setItem('cerd_demo', JSON.stringify(D)); } catch(e){} }

/* ==================================================================
   AUTH (mismo patron que Gym Bro: la sesion dura 30 dias)
   ================================================================== */
var SESION_DIAS = 30;
function saveSess(){ try { localStorage.setItem('cerd_mail', userEmail); localStorage.setItem('cerd_exp', String(Date.now() + SESION_DIAS * 864e5)); } catch(e){} }
function loadSess(){
  try {
    var exp = parseInt(localStorage.getItem('cerd_exp') || '0', 10), em = (localStorage.getItem('cerd_mail') || '').toLowerCase().trim();
    if (em && exp > Date.now()){ userEmail = em; return true; }
  } catch(e){}
  return false;
}
function salir(){
  if (DEMO){ try { localStorage.removeItem('cerd_demo'); } catch(e){} location.href = location.pathname; return; }
  try { localStorage.removeItem('cerd_mail'); localStorage.removeItem('cerd_exp'); localStorage.removeItem('cerd_cache'); } catch(e){}
  location.reload();
}
function showApp(){ $('login-screen').style.display = 'none'; $('app').style.display = 'block'; }
function showDenied(){ hideLoad(); $('app').style.display = 'none'; $('denied-mail').innerHTML = esc(userEmail) + ' no est&aacute; en la lista de acceso.'; $('denied').style.display = 'flex'; }
function hideLoad(){ $('loader').style.display = 'none'; }
function initAuth(){
  if (DEMO){ showApp(); fetchData(); return; }
  if (!(window.google && google.accounts && google.accounts.oauth2)){ setTimeout(initAuth, 250); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:'openid email profile',
    callback:function(r){
      if (r.error) return;
      accessToken = r.access_token;
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer ' + accessToken}})
        .then(function(res){ return res.json(); })
        .then(function(info){ userEmail = (info.email || '').toLowerCase().trim(); })
        .catch(function(){})
        .then(function(){ saveSess(); showApp(); tryCache(); fetchData(); });
    }
  });
  if (loadSess()){ showApp(); tryCache(); fetchData(); }
  else { hideLoad(); $('login-screen').style.display = 'flex'; }
}

window.addEventListener('load', function(){
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) (function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.t); }); })(tabs[i]);
  $('btn-login').addEventListener('click', function(){ tokenClient && tokenClient.requestAccessToken({prompt:'select_account'}); });
  $('btn-set').addEventListener('click', openAjustes);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
  try { var t = localStorage.getItem('cerd_tab'); if (t && $('p-' + t)) activeTab = t; } catch(e){}
  initAuth();
});
